<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Sports event reservation chatbot orchestration</title>
  <desc id="desc">A user talks to a sports event reservation chatbot. A router redirects each task to one of two subgraphs: a ticket reservation agent or a question answering agent.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="userFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="routerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ticketFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="qaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="920" height="640" rx="24" fill="url(#bg)"/>

  <text x="460" y="48" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">Sports event reservation chatbot</text>
  <text x="460" y="76" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Agentic orchestration: router redirects tasks to subgraphs</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="360" y="108" width="200" height="88" rx="16" fill="url(#userFill)"/>
  </g>
  <text x="460" y="146" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">User</text>
  <text x="460" y="168" text-anchor="middle" fill="#082f49" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">sports event request</text>

  <line x1="460" y1="196" x2="460" y2="248" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="300" y="256" width="320" height="112" rx="18" fill="url(#routerFill)"/>
  </g>
  <text x="460" y="300" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">Router</text>
  <text x="460" y="326" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">redirects the task towards subgraphs</text>

  <!-- Arrows to subgraphs -->
  <path d="M 360 368 C 280 368, 220 400, 220 448" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 560 368 C 640 368, 700 400, 700 448" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Ticket reservation subgraph -->
  <g filter="url(#shadow)">
    <rect x="70" y="456" width="300" height="128" rx="18" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <rect x="92" y="484" width="256" height="76" rx="14" fill="url(#ticketFill)"/>
  </g>
  <text x="220" y="478" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">subgraph</text>
  <text x="220" y="516" text-anchor="middle" fill="#042f2e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700">Ticket reservation agent</text>
  <text x="220" y="538" text-anchor="middle" fill="#064e3b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">books / manages event tickets</text>

  <!-- Question answering subgraph -->
  <g filter="url(#shadow)">
    <rect x="550" y="456" width="300" height="128" rx="18" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <rect x="572" y="484" width="256" height="76" rx="14" fill="url(#qaFill)"/>
  </g>
  <text x="700" y="478" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">subgraph</text>
  <text x="700" y="516" text-anchor="middle" fill="#451a03" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700">Question answering agent</text>
  <text x="700" y="538" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">answers event / policy questions</text>
</svg>
