<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Sports event reservation chatbot orchestration</title>
  <desc id="desc">A user talks to a sports event reservation chatbot. A router redirects each task to one of two subgraphs: a ticket reservation agent or a question answering agent.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#ffffff"/>

  <text x="360" y="36" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Sports event reservation chatbot</text>
  <text x="360" y="58" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Router redirects tasks to specialist subgraphs</text>

  <!-- User -->
  <rect x="280" y="80" width="160" height="60" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="360" y="108" text-anchor="middle" fill="#0c4a6e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">User</text>
  <text x="360" y="126" text-anchor="middle" fill="#0c4a6e" font-family="system-ui, sans-serif" font-size="11">sports event request</text>

  <line x1="360" y1="140" x2="360" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="240" y="188" width="240" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="222" text-anchor="middle" fill="#3b0764" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Router</text>
  <text x="360" y="242" text-anchor="middle" fill="#3b0764" font-family="system-ui, sans-serif" font-size="11">redirects towards subgraphs</text>

  <!-- Arrows to subgraphs -->
  <path d="M 300 260 C 240 280, 180 300, 180 330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 420 260 C 480 280, 540 300, 540 330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ticket reservation -->
  <rect x="60" y="338" width="240" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="370" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="600">subgraph</text>
  <text x="180" y="392" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Ticket reservation agent</text>
  <text x="180" y="414" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11">books / manages event tickets</text>

  <!-- Question answering -->
  <rect x="420" y="338" width="240" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="540" y="370" text-anchor="middle" fill="#713f12" font-family="system-ui, sans-serif" font-size="10" font-weight="600">subgraph</text>
  <text x="540" y="392" text-anchor="middle" fill="#713f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Question answering agent</text>
  <text x="540" y="414" text-anchor="middle" fill="#713f12" font-family="system-ui, sans-serif" font-size="11">answers event / policy questions</text>
</svg>
